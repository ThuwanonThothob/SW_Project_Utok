services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: thaiflood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flood_db
      POSTGRES_USER: flood_user
      POSTGRES_PASSWORD: flood_password
    ports:
      - "5432:5432"
    volumes:
      - flood_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flood_user -d flood_db"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  flood_postgres_data:
